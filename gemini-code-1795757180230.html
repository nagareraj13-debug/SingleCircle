<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#03060d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <title>SingleCircle — Global Study & Friends</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #03060d;
      --pill-bg: rgba(255, 255, 255, 0.042);
      --pill-bg-focus: rgba(59, 130, 246, 0.09);
      --border: rgba(255, 255, 255, 0.085);
      --border-top: rgba(255, 255, 255, 0.16);
      --border-focus: rgba(96, 165, 250, 0.72);
      --text: #f8fafc;
      --muted: #8b9bb4;
      --accent: #3b82f6;
      --accent-light: #7dd3fc;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body {
      min-height: 100dvh;
      background-color: var(--bg);
      color: var(--text);
      color-scheme: dark;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: max(18px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom));
      position: relative;
    }

    /* Living Aurora Background */
    .aurora {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .aurora::before {
      content: "";
      position: absolute;
      top: -160px;
      left: 50%;
      width: 520px;
      height: 460px;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(59, 130, 246, 0.24) 0%, rgba(56, 189, 248, 0.07) 42%, transparent 72%);
      animation: breathe 8s ease-in-out infinite alternate;
    }

    .aurora::after {
      content: "";
      position: absolute;
      bottom: -180px;
      right: -110px;
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.14) 0%, transparent 70%);
      animation: breathe 11s ease-in-out infinite alternate-reverse;
    }

    @keyframes breathe {
      from { opacity: 0.72; transform: translateX(-50%) scale(0.95); }
      to { opacity: 1; transform: translateX(-50%) scale(1.08); }
    }

    /* Full-Width Smooth Orbital Canvas */
    #orbitCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 58vh;
      pointer-events: none;
      z-index: 1;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 68%, rgba(0,0,0,0) 100%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 68%, rgba(0,0,0,0) 100%);
    }

    /* Minimal Top Bar */
    header {
      width: 100%;
      max-width: 420px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 3;
      animation: riseIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-orb {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, #bae6fd, #2563eb);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.9), 0 0 24px rgba(59, 130, 246, 0.5);
      animation: pulseOrb 3s ease-in-out infinite;
    }

    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.22); opacity: 0.8; }
    }

    .top-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #93c5fd;
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(96, 165, 250, 0.22);
      border-top-color: rgba(147, 197, 253, 0.38);
      padding: 6px 12px;
      border-radius: 999px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }

    /* Main Content */
    main {
      width: 100%;
      max-width: 400px;
      z-index: 3;
      display: flex;
      flex-direction: column;
      gap: 26px;
      margin: 14px 0 22px;
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 36px 4px 10px;
      animation: riseIn 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.08s both;
    }

    .hero h1 {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.08;
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
    }

    .hero h1 .shimmer {
      display: inline-block;
      background: linear-gradient(
        105deg,
        #60a5fa 0%,
        #3b82f6 35%,
        #e0f2fe 50%,
        #3b82f6 65%,
        #60a5fa 100%
      );
      background-size: 220% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textShimmer 5.5s linear infinite;
    }

    @keyframes textShimmer {
      0% { background-position: 200% center; }
      100% { background-position: -200% center; }
    }

    .hero p {
      margin-top: 13px;
      font-size: 14px;
      line-height: 1.58;
      color: #94a3b8;
      max-width: 310px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Auth Stack */
    .auth-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: riseIn 0.72s cubic-bezier(0.22, 1, 0.36, 1) 0.16s both;
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Sliding Glass Pill Tabs */
    .pill-tabs {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(255, 255, 255, 0.038);
      border: 1px solid var(--border);
      border-top-color: var(--border-top);
      border-radius: 999px;
      padding: 4px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .tab-slider {
      position: absolute;
      top: 4px;
      left: 4px;
      width: calc(50% - 4px);
      height: calc(100% - 8px);
      background: linear-gradient(180deg, rgba(59, 130, 246, 0.32), rgba(37, 99, 235, 0.16));
      border: 1px solid rgba(96, 165, 250, 0.38);
      border-top-color: rgba(186, 230, 253, 0.5);
      border-radius: 999px;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.25);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .pill-tabs.signup-active .tab-slider {
      transform: translateX(100%);
    }

    .tab-btn {
      position: relative;
      z-index: 1;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 600;
      padding: 11px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .tab-btn.active {
      color: var(--text);
    }

    /* Google Pill CTA */
    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
      color: #090d16;
      border: none;
      border-radius: 999px;
      padding: 14px 20px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transition: transform 0.16s ease, opacity 0.2s ease;
    }

    .btn-google:active { transform: scale(0.97); }
    .btn-google:disabled, .btn-primary:disabled { opacity: 0.65; pointer-events: none; }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 2px 8px;
      font-size: 11.5px;
      font-weight: 500;
      color: #64748b;
      letter-spacing: 0.02em;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.13), transparent);
    }

    /* Specular Glass Capsule Inputs */
    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-pill {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--pill-bg);
      border: 1px solid var(--border);
      border-top-color: var(--border-top);
      border-radius: 999px;
      padding: 0 17px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: border-color 0.22s ease, background 0.22s ease, box-shadow 0.22s ease;
    }

    .input-pill:focus-within {
      background: var(--pill-bg-focus);
      border-color: var(--border-focus);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.14), 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .input-icon {
      width: 18px;
      height: 18px;
      color: #64748b;
      flex-shrink: 0;
      margin-right: 11px;
      transition: color 0.2s ease;
    }

    .input-pill:focus-within .input-icon { color: var(--accent-light); }

    .input-pill input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14.5px;
      font-weight: 500;
      padding: 14px 0;
    }

    .input-pill input::placeholder { color: #5b6b84; }

    .eye-btn {
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 6px 2px 6px 8px;
      display: flex;
      align-items: center;
    }

    .forgot-row {
      display: flex;
      justify-content: flex-end;
      padding: 0 10px;
      margin-top: -4px;
    }

    .forgot-btn {
      background: transparent;
      border: none;
      color: #7dd3fc;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      opacity: 0.85;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .row-2 .input-pill { padding: 0 13px; }
    .row-2 .input-pill input { font-size: 13.5px; }

    .dob-wrap {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .mini-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      padding-left: 14px;
    }

    .policy-check {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 4px 8px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
      cursor: pointer;
    }

    .policy-check input {
      margin-top: 2px;
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      flex-shrink: 0;
    }

    /* Primary Button with Sweeping Light Sheen */
    .btn-primary {
      position: relative;
      overflow: hidden;
      width: 100%;
      margin-top: 4px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 60%, #1d4ed8 100%);
      color: #ffffff;
      border: 1px solid rgba(147, 197, 253, 0.35);
      border-radius: 999px;
      padding: 15px 22px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.28);
      transition: transform 0.16s ease, opacity 0.2s ease;
    }

    .btn-primary::after {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 70%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      transform: skewX(-22deg);
      animation: sheenSweep 4.5s ease-in-out infinite;
    }

    @keyframes sheenSweep {
      0%, 65% { left: -120%; }
      100% { left: 160%; }
    }

    .btn-primary:active { transform: scale(0.97); }

    .message-pill {
      display: none;
      padding: 11px 16px;
      border-radius: 18px;
      font-size: 12.5px;
      font-weight: 500;
      text-align: center;
      line-height: 1.45;
    }

    .message-pill.error {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.32);
      color: #fca5a5;
    }

    .message-pill.success {
      display: block;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.32);
      color: #86efac;
    }

    .hidden { display: none !important; }

    /* Footer */
    footer {
      width: 100%;
      max-width: 400px;
      text-align: center;
      z-index: 3;
      font-size: 11.5px;
      color: #5b6b84;
      animation: riseIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.22s both;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .footer-links button {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }

    /* Native Bottom Sheet */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 5, 12, 0.76);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 30;
    }

    .sheet {
      width: 100%;
      max-width: 460px;
      background: #0a101f;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 28px 28px 0 0;
      padding: 12px 24px max(28px, env(safe-area-inset-bottom));
      animation: slideUp 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      margin: 0 auto 18px;
    }

    .sheet h3 { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
    .sheet p { font-size: 13.5px; color: var(--muted); line-height: 1.65; margin-bottom: 20px; }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="aurora"></div>
  <canvas id="orbitCanvas"></canvas>

  <header>
    <div class="brand">
      <div class="brand-orb"></div>
      <span>SingleCircle</span>
    </div>
    <div class="top-pill">
      <span class="live-dot"></span>
      Global Study & Friends
    </div>
  </header>

  <main>
    <section class="hero" id="heroSection">
      <h1>Welcome to<br><span class="shimmer">SingleCircle</span></h1>
      <p>A mutual space for college students and global learners to connect, share skills, and make friends.</p>
    </section>

    <section class="auth-stack">
      <div class="pill-tabs" id="pillTabs">
        <div class="tab-slider"></div>
        <button class="tab-btn active" id="tabLogin" type="button">Log In</button>
        <button class="tab-btn" id="tabSignup" type="button">Create Account</button>
      </div>

      <button class="btn-google" id="googleBtn" type="button">
        <svg width="19" height="19" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span id="googleBtnText">Continue with Google</span>
      </button>

      <div class="divider">or continue with email</div>

      <!-- Login Form -->
      <form id="loginForm">
        <div class="input-pill">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="3"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
          <input type="email" id="loginEmail" placeholder="Email address" autocomplete="email" required />
        </div>

        <div class="input-pill">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required />
          <button class="eye-btn" type="button" onclick="togglePass('loginPassword', this)" aria-label="Toggle password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <div class="forgot-row">
          <button class="forgot-btn" id="forgotBtn" type="button">Forgot password?</button>
        </div>

        <button class="btn-primary" id="loginSubmitBtn" type="submit">Log In</button>
      </form>

      <!-- Signup Form -->
      <form id="signupForm" class="hidden">
        <div class="input-pill">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" id="signupName" placeholder="Full name" autocomplete="name" required />
        </div>

        <div class="row-2">
          <div class="dob-wrap">
            <span class="mini-label">Date of Birth</span>
            <div class="input-pill">
              <input type="date" id="signupDob" required />
            </div>
          </div>
          <div class="dob-wrap">
            <span class="mini-label">Country</span>
            <div class="input-pill">
              <input type="text" id="signupCountry" placeholder="e.g. India" required />
            </div>
          </div>
        </div>

        <div class="input-pill">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="3"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
          <input type="email" id="signupEmail" placeholder="Email address" autocomplete="email" required />
        </div>

        <div class="input-pill">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="signupPassword" minlength="6" placeholder="Create password (6+ chars)" autocomplete="new-password" required />
          <button class="eye-btn" type="button" onclick="togglePass('signupPassword', this)" aria-label="Toggle password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <label class="policy-check">
          <input type="checkbox" id="agreePolicy" required />
          <span>I confirm I am an adult college student/learner and agree to SingleCircle's Community Safety & Zero-Harassment Guidelines.</span>
        </label>

        <button class="btn-primary" id="signupSubmitBtn" type="submit">Join SingleCircle</button>
      </form>

      <div id="msgBox" class="message-pill"></div>
    </section>
  </main>

  <footer>
    <div class="footer-links">
      <button type="button" onclick="openPolicy('safety')">Safety Standards</button>
      <button type="button" onclick="openPolicy('privacy')">Privacy Policy</button>
      <button type="button" onclick="openPolicy('terms')">Community Rules</button>
    </div>
    <div>© 2026 SingleCircle • Global Learning & Friendship</div>
  </footer>

  <!-- Bottom Sheet -->
  <div id="policySheet" class="sheet-backdrop hidden" onclick="closePolicyOnBackdrop(event)">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3 id="sheetTitle">Safety Standards</h3>
      <p id="sheetBody"></p>

  <!-- 60 FPS Right-Tilted Movable 3D-Sway Elliptical Orbit Engine -->
  <script>
    const canvas = document.getElementById("orbitCanvas");
    const ctx = canvas.getContext("2d");
    const titleEl = document.querySelector(".shimmer");
    const heroEl = document.getElementById("heroSection");

    let W = 0, H = 0;
    let targetX = 0, targetY = 0;
    let pointerX = 0, pointerY = 0;
    let smoothX = 0, smoothY = 0;

    function updateAnchor() {
      if (!titleEl) return;
      const rect = titleEl.getBoundingClientRect();
      targetX = rect.left + rect.width * 0.75;
      targetY = rect.top + rect.height * 0.50;
    }

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = canvas.clientWidth;
      H = canvas.clientHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      updateAnchor();
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("scroll", updateAnchor, { passive: true });
    heroEl?.addEventListener("animationend", updateAnchor);
    document.fonts?.ready.then(updateAnchor);
    resizeCanvas();
    setTimeout(updateAnchor, 800);

    function handleMove(x, y) {
      pointerX = ((x / window.innerWidth) - 0.5) * 14;
      pointerY = ((y / window.innerHeight) - 0.5) * 10;
    }
    window.addEventListener("pointermove", (e) => handleMove(e.clientX, e.clientY), { passive: true });
    window.addEventListener("touchmove", (e) => {
      if (e.touches[0]) handleMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    const orbits = [
      {
        rx: 84, ry: 35, baseTilt: -0.96, swayAmp: 0.14,
        swaySpeed: 0.0009, depthSpeed: 0.0012, phase: 0,
        speed: 0.022, angle: 0.4, color: [96, 165, 250], dashed: false, lineWidth: 1.7
      },
      {
        rx: 78, ry: 33, baseTilt: 0.80, swayAmp: 0.12,
        swaySpeed: 0.00075, depthSpeed: 0.001, phase: 2.1,
        speed: -0.017, angle: 3.1, color: [56, 189, 248], dashed: true, lineWidth: 1.35
      }
    ];

    const stars = Array.from({ length: 18 }, () => ({
      dx: (Math.random() - 0.5) * 260,
      dy: (Math.random() - 0.5) * 170,
      r: Math.random() * 1.2 + 0.4,
      p: Math.random() * Math.PI * 2,
      s: Math.random() * 0.02 + 0.008
    }));

    function ellipsePoint(cx, cy, rx, ry, tilt, t) {
      const x0 = rx * Math.cos(t);
      const y0 = ry * Math.sin(t);
      const cosT = Math.cos(tilt);
      const sinT = Math.sin(tilt);
      return {
        x: cx + x0 * cosT - y0 * sinT,
        y: cy + x0 * sinT + y0 * cosT,
        depth: (Math.sin(t) + 1) / 2
      };
    }

    function animate(time) {
      ctx.clearRect(0, 0, W, H);
      smoothX += (pointerX - smoothX) * 0.06;
      smoothY += (pointerY - smoothY) * 0.06;

      const scale = Math.min(Math.max(W / 390, 0.88), 1.15);
      const cx = (targetX || W * 0.64) + smoothX;
      const cy = (targetY || 175) + smoothY;

      stars.forEach(st => {
        st.p += st.s;
        const alpha = 0.12 + Math.abs(Math.sin(st.p)) * 0.4;
        ctx.fillStyle = `rgba(147, 197, 253, ${alpha})`;
        ctx.beginPath();
        ctx.arc(cx + st.dx * scale, cy + st.dy * scale, st.r, 0, Math.PI * 2);
        ctx.fill();
      });

      orbits.forEach((o) => {
        const tilt = o.baseTilt + Math.sin(time * o.swaySpeed + o.phase) * o.swayAmp;
        const rx = o.rx * scale;
        const ry = o.ry * scale * (0.86 + Math.cos(time * o.depthSpeed + o.phase) * 0.16);
        const [r, g, b] = o.color;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(tilt);

        if (!o.dashed) {
          ctx.beginPath();
          ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, 0.14)`;
          ctx.lineWidth = 5;
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
        ctx.strokeStyle = o.dashed ? `rgba(${r}, ${g}, ${b}, 0.36)` : `rgba(${r}, ${g}, ${b}, 0.58)`;
        ctx.lineWidth = o.lineWidth;
        if (o.dashed) ctx.setLineDash([4, 5]);
        ctx.stroke();
        ctx.restore();

        const dir = o.speed > 0 ? 1 : -1;
        const trailSteps = 24;
        for (let i = trailSteps; i >= 1; i--) {
          const t = o.angle - dir * i * 0.048;
          const pt = ellipsePoint(cx, cy, rx, ry, tilt, t);
          const ratio = 1 - i / trailSteps;
          const alpha = ratio * ratio * (0.35 + pt.depth * 0.6);
          const radius = (0.7 + ratio * 2.1) * (0.75 + pt.depth * 0.35);
          ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, radius, 0, Math.PI * 2);
          ctx.fill();
        }

        const head = ellipsePoint(cx, cy, rx, ry, tilt, o.angle);
        const headSize = 2.6 + head.depth * 1.7;

        const glow = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, headSize * 4.8);
        glow.addColorStop(0, `rgba(224, 242, 254, ${0.75 + head.depth * 0.25})`);
        glow.addColorStop(0.35, `rgba(${r}, ${g}, ${b}, ${0.48 + head.depth * 0.3})`);
        glow.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(head.x, head.y, headSize * 4.8, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(head.x, head.y, headSize * 0.72, 0, Math.PI * 2);
        ctx.fill();

        o.angle += o.speed * (0.85 + head.depth * 0.3);
      });

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>

  <!-- Firebase Modular SDK (Bulletproof Mobile Google Login) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
    import {
      getAuth,
      setPersistence,
      browserLocalPersistence,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithRedirect,
      getRedirectResult,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      updateProfile,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      updateDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACZOLeOz4XOK6dO1LW0Nbf27ng2ZPaC08",
      authDomain: "singlecircle.firebaseapp.com",
      projectId: "singlecircle",
      storageBucket: "singlecircle.firebasestorage.app",
      messagingSenderId: "145275527506",
      appId: "1:145275527506:web:e223164b91c7c759f0da8b",
      measurementId: "G-D9EGP5N3PF"
    };

    const app = initializeApp(firebaseConfig);
    try { getAnalytics(app); } catch {}
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();
    googleProvider.setCustomParameters({ prompt: "select_account" });

    // Ensure session persists properly on mobile browsers
    setPersistence(auth, browserLocalPersistence).catch(() => {});

    const pillTabs = document.getElementById("pillTabs");
    const tabLogin = document.getElementById("tabLogin");
    const tabSignup = document.getElementById("tabSignup");
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");
    const googleBtn = document.getElementById("googleBtn");
    const googleBtnText = document.getElementById("googleBtnText");
    const loginSubmitBtn = document.getElementById("loginSubmitBtn");
    const signupSubmitBtn = document.getElementById("signupSubmitBtn");
    const forgotBtn = document.getElementById("forgotBtn");
    const msgBox = document.getElementById("msgBox");

    let isAuthProcessing = false;

    function showMsg(text, type = "error") {
      msgBox.textContent = text;
      msgBox.className = `message-pill ${type}`;
    }

    function clearMsg() {
      msgBox.className = "message-pill";
      msgBox.textContent = "";
    }

    // Detect in-app browsers (WhatsApp / Instagram / Facebook WebView)
    const ua = navigator.userAgent || "";
    const isInAppBrowser = /FBAN|FBAV|Instagram|WhatsApp|Line\/|wv\)/i.test(ua);
    if (isInAppBrowser) {
      showMsg("Tip: Tap the 3 dots (⋮) at top-right and select 'Open in Chrome' for smooth Google Login.", "error");
    }

    async function completeGoogleUserSetup(user) {
      try {
        const userRef = doc(db, "users", user.uid);
        const snap = await getDoc(userRef);

        if (snap.exists()) {
          if (snap.data().status === "banned") {
            await signOut(auth);
            showMsg("Your account has been suspended for violating community safety rules.");
            return false;
          }
          await updateDoc(userRef, {
            lastLogin: serverTimestamp(),
            photoURL: user.photoURL || snap.data().photoURL || ""
          }).catch(() => {});
        } else {
          await setDoc(userRef, {
            uid: user.uid,
            name: user.displayName || "Student",
            email: user.email || "",
            photoURL: user.photoURL || "",
            country: "Global",
            college: "",
            interest: "Coding",
            bio: "Excited to connect and learn!",
            role: "user",
            status: "active",
            blockedUsers: [],
            createdAt: serverTimestamp(),
            lastLogin: serverTimestamp()
          }, { merge: true }).catch(() => {});
        }
      } catch (e) {
        console.warn("Profile sync fallback to app.html:", e);
      }

      showMsg("Login successful! Opening SingleCircle...", "success");
      setTimeout(() => { window.location.href = "app.html"; }, 500);
      return true;
    }

    // Handle redirect return if fallback redirect was used
    getRedirectResult(auth)
      .then(async (result) => {
        if (result && result.user) {
          isAuthProcessing = true;
          await completeGoogleUserSetup(result.user);
          isAuthProcessing = false;
        }
      })
      .catch((err) => {
        if (err?.code) showMsg(friendlyError(err.code));
      });

    // Auto-redirect if user is already logged in
    onAuthStateChanged(auth, async (user) => {
      if (!user || isAuthProcessing) return;
      try {
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists() && snap.data().status === "banned") {
          await signOut(auth);
          showMsg("Your account has been suspended for violating community safety rules.");
          return;
        }
        window.location.href = "app.html";
      } catch {
        window.location.href = "app.html";
      }
    });

    tabLogin.addEventListener("click", () => {
      pillTabs.classList.remove("signup-active");
      tabLogin.classList.add("active");
      tabSignup.classList.remove("active");
      loginForm.classList.remove("hidden");
      signupForm.classList.add("hidden");
      clearMsg();
    });

    tabSignup.addEventListener("click", () => {
      pillTabs.classList.add("signup-active");
      tabSignup.classList.add("active");
      tabLogin.classList.remove("active");
      signupForm.classList.remove("hidden");
      loginForm.classList.add("hidden");
      clearMsg();
    });

    window.togglePass = (id, btn) => {
      const input = document.getElementById(id);
      input.type = input.type === "password" ? "text" : "password";
      btn.style.color = input.type === "text" ? "#7dd3fc" : "#64748b";
    };

    function isAdult(dobString) {
      const dob = new Date(dobString);
      const today = new Date();
      let age = today.getFullYear() - dob.getFullYear();
      const m = today.getMonth() - dob.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) age--;
      return age >= 18;
    }

    function friendlyError(code) {
      const map = {
        "auth/invalid-credential": "Invalid email or password.",
        "auth/user-not-found": "No account found with this email.",
        "auth/wrong-password": "Incorrect password. Try again.",
        "auth/email-already-in-use": "This email is already registered. Please Log In.",
        "auth/weak-password": "Password must be at least 6 characters.",
        "auth/unauthorized-domain": "Domain not authorized in Firebase Auth settings.",
        "auth/popup-closed-by-user": "Google sign-in popup was closed before finishing.",
        "auth/popup-blocked": "Popup blocked. Switching to redirect login...",
        "auth/network-request-failed": "Network error. Check your internet connection."
      };
      return map[code] || `Login error (${code || "unknown"}). Please open in Chrome and try again.`;
    }

    // Bulletproof Google Login (Popup first -> Auto Redirect fallback)
    googleBtn.addEventListener("click", async () => {
      clearMsg();
      isAuthProcessing = true;
      googleBtn.disabled = true;
      googleBtnText.textContent = "Connecting...";

      try {
        const result = await signInWithPopup(auth, googleProvider);
        if (result && result.user) {
          await completeGoogleUserSetup(result.user);
        }
      } catch (err) {
        if (
          err.code === "auth/popup-blocked" ||
          err.code === "auth/operation-not-supported-in-this-environment" ||
          err.code === "auth/cancelled-popup-request"
        ) {
          showMsg("Redirecting to Google Sign-In...", "success");
          try {
            await signInWithRedirect(auth, googleProvider);
            return;
          } catch (rErr) {
            showMsg(friendlyError(rErr.code));
          }
        } else {
          showMsg(friendlyError(err.code));
        }
      } finally {
        isAuthProcessing = false;
        googleBtn.disabled = false;
        googleBtnText.textContent = "Continue with Google";
      }
    });

    // Email Login
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMsg();
      isAuthProcessing = true;
      loginSubmitBtn.disabled = true;
      loginSubmitBtn.textContent = "Logging in...";

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        const userRef = doc(db, "users", cred.user.uid);
        const snap = await getDoc(userRef);

        if (snap.exists() && snap.data().status === "banned") {
          await signOut(auth);
          showMsg("Your account has been suspended for violating community safety rules.");
          return;
        }
        if (snap.exists()) {
          await updateDoc(userRef, { lastLogin: serverTimestamp() }).catch(() => {});
        }

        showMsg("Welcome back! Opening SingleCircle...", "success");
        setTimeout(() => { window.location.href = "app.html"; }, 500);
      } catch (err) {
        showMsg(friendlyError(err.code));
      } finally {
        isAuthProcessing = false;
        loginSubmitBtn.disabled = false;
        loginSubmitBtn.textContent = "Log In";
      }
    });

    // Forgot Password
    forgotBtn.addEventListener("click", async () => {
      clearMsg();
      const email = document.getElementById("loginEmail").value.trim();
      if (!email) {
        return showMsg("Pehle upar Email box mein apna email enter karein, phir Forgot password tap karein.");
      }
      try {
        await sendPasswordResetEmail(auth, email);
        showMsg("Password reset link sent to your email!", "success");
      } catch (err) {
        showMsg(friendlyError(err.code));
      }
    });

    // Email Signup
    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMsg();
      const dob = document.getElementById("signupDob").value;
      if (!isAdult(dob)) {
        return showMsg("SingleCircle is strictly for college students and adult learners (18+).");
      }

      isAuthProcessing = true;
      signupSubmitBtn.disabled = true;
      signupSubmitBtn.textContent = "Creating account...";

      const name = document.getElementById("signupName").value.trim();
      const country = document.getElementById("signupCountry").value.trim();
      const email = document.getElementById("signupEmail").value.trim();
      const password = document.getElementById("signupPassword").value;

      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(cred.user, { displayName: name });

        await setDoc(doc(db, "users", cred.user.uid), {
          uid: cred.user.uid,
          name,
          email,
          photoURL: "",
          country,
          dob,
          college: "",
          interest: "Coding",
          bio: "Excited to connect and learn!",
          role: "user",
          status: "active",
          blockedUsers: [],
          createdAt: serverTimestamp(),
          lastLogin: serverTimestamp()
        }, { merge: true }).catch(() => {});

        showMsg("Account created! Opening SingleCircle...", "success");
        setTimeout(() => { window.location.href = "app.html"; }, 500);
      } catch (err) {
        showMsg(friendlyError(err.code));
      } finally {
        isAuthProcessing = false;
        signupSubmitBtn.disabled = false;
        signupSubmitBtn.textContent = "Join SingleCircle";
      }
    });

    const policies = {
      safety: {
        title: "Child & Community Safety Standards",
        body: "SingleCircle is built exclusively for college students and adult learners. We strictly prohibit harassment, spam, hate speech, and child sexual abuse or exploitation (CSAE). Every profile and chat includes one-tap Block & Report controls monitored by our moderation team."
      },
      privacy: {
        title: "Privacy Policy",
        body: "We only collect your Name, Email, Country, and Date of Birth for age verification and building your learning profile. We never sell your personal data, and you can permanently delete your account and chat history anytime."
      },
      terms: {
        title: "Community Rules",
        body: "SingleCircle is a friendship, language exchange, and skill-sharing space—not a dating app. Treat every global peer with respect. Accounts violating safety rules are suspended permanently."
      }
    };

    window.openPolicy = (key) => {
      document.getElementById("sheetTitle").textContent = policies[key].title;
      document.getElementById("sheetBody").textContent = policies[key].body;
      document.getElementById("policySheet").classList.remove("hidden");
    };

    window.closePolicy = () => {
      document.getElementById("policySheet").classList.add("hidden");
    };

    window.closePolicyOnBackdrop = (e) => {
      if (e.target.id === "policySheet") window.closePolicy();
    };
  </script>
